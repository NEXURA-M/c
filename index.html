<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYRA PINME - Created by Muhammad Taqi</title>
<!-- JSZip library for ZIP file extraction -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root { 
    --bg: #07070c; 
    --surface: #12121a; 
    --stroke: #2a2a35; 
    --text: #f2f3f8; 
    --brand: #7c5cff; 
    --success: #2ee6a8; 
  }
  body { 
    font-family: 'Inter', sans-serif; 
    background: var(--bg); 
    color: var(--text); 
    margin: 0; 
    padding: 0; 
    min-height: 100vh; 
    display: flex;
    flex-direction: column;
  }
  
  /* VIEWER MODE (Jab link khola jaye) */
  #viewerFrame {
    width: 100vw;
    height: 100vh;
    border: none;
    display: none;
    background: #fff;
  }

  /* EDITOR MODE */
  #editorContainer {
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    padding: 40px 20px;
  }
  .header { text-align: center; margin-bottom: 30px; }
  .header h1 { background: linear-gradient(90deg, #7c5cff, #21d4fd); -webkit-background-clip: text; color: transparent; margin: 0 0 10px; font-size: 2.5rem; }
  .card { background: var(--surface); border: 1px solid var(--stroke); border-radius: 16px; padding: 30px; width: 100%; max-width: 700px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
  .input-group { margin-bottom: 20px; }
  label { display: block; font-size: 0.9rem; margin-bottom: 8px; color: #9aa0b5; font-weight: 600; }
  input[type="text"], textarea, input[type="file"] { width: 100%; padding: 12px; background: #0a0a0f; border: 1px solid var(--stroke); border-radius: 8px; color: #fff; font-family: inherit; box-sizing: border-box; transition: 0.3s; }
  input:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(124,92,255,0.2); }
  textarea { height: 250px; font-family: 'JetBrains Mono', monospace; resize: vertical; }
  .btn { background: linear-gradient(90deg, #7c5cff, #21d4fd); color: #fff; border: none; padding: 16px; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.3s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(124,92,255,0.4); }
  .btn:disabled { background: #333; cursor: not-allowed; transform: none; box-shadow: none; }
  
  #result { margin-top: 20px; padding: 20px; border-radius: 12px; display: none; background: rgba(46, 230, 168, 0.1); border: 1px solid var(--success); color: var(--success); text-align: center; }
  #result a { display: block; margin-top: 10px; color: #8ce8ff; font-size: 1.1rem; font-weight: bold; word-break: break-all; text-decoration: none; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px; }
  #result a:hover { text-decoration: underline; }
  .copy-btn { margin-top: 10px; background: var(--success); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }

  /* Loader */
  .loader { display: none; text-align: center; margin-top: 20px; color: var(--brand); font-weight: bold; }
</style>
</head>
<body>

  <!-- ======================= VIEWER MODE ======================= -->
  <iframe id="viewerFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>

  <!-- ======================= EDITOR MODE ======================= -->
  <div id="editorContainer">
    <div class="header">
      <h1>LYRA PINME</h1>
      <p style="color: #9aa0b5;">Created by Muhammad Taqi</p>
    </div>

    <div class="card">
      <div class="input-group">
        <label>Project Name (For Title)</label>
        <input type="text" id="projectName" placeholder="My Awesome Website">
      </div>
      
      <div class="input-group">
        <label>Option 1: Paste HTML Code</label>
        <textarea id="htmlCode" placeholder="<h1>Hello World</h1>"></textarea>
      </div>
      
      <div class="input-group">
        <label>Option 2: Upload .html or .zip file</label>
        <input type="file" id="fileUpload" accept=".html, .zip" style="color: #9aa0b5;">
      </div>

      <button class="btn" id="publishBtn" onclick="publishProject()">Publish Permanently 🚀</button>
      
      <div class="loader" id="loader">Uploading and Generating Link... Please Wait ⏳</div>
      
      <div id="result"></div>
    </div>
  </div>

<script>
/* =========================================================
   1. VIEWER LOGIC (Agar URL mein # ID ho toh code render karo)
   ========================================================= */
async function loadViewer() {
  const hash = window.location.hash.substring(1);
  
  if (hash) {
    // Agar hash mojood hai, toh editor hide karein aur iframe show karein
    document.getElementById('editorContainer').style.display = 'none';
    const iframe = document.getElementById('viewerFrame');
    iframe.style.display = 'block';
    iframe.srcdoc = '<h2 style="text-align:center; font-family:sans-serif; margin-top:20%;">Loading your website... ⏳</h2>';

    try {
      // JSONBlob se user ka data fetch karein
      const response = await fetch(`https://jsonblob.com/api/jsonBlob/${hash}`);
      
      if (!response.ok) throw new Error("Page not found or deleted.");
      
      const data = await response.json();
      
      // Title set karein
      document.title = data.name || 'LYRA PINME - Live Site';
      
      // Iframe ke andar user ka HTML render karein
      iframe.srcdoc = data.html;
      
    } catch (error) {
      iframe.srcdoc = `<div style="text-align:center; font-family:sans-serif; margin-top:20%; color:red;">
        <h1>404 - Website Not Found</h1>
        <p>This link might be invalid or deleted.</p>
        <a href="${window.location.pathname}">Go to Home</a>
      </div>`;
    }
  }
}
// Page load hote hi viewer check karein
window.addEventListener('DOMContentLoaded', loadViewer);


/* =========================================================
   2. PUBLISH LOGIC (Bina Token ke JSONBlob par upload)
   ========================================================= */
async function publishProject() {
  const projectName = document.getElementById('projectName').value.trim() || 'LYRA PINME Page';
  const htmlCode = document.getElementById('htmlCode').value;
  const fileInput = document.getElementById('fileUpload').files[0];
  
  const btn = document.getElementById('publishBtn');
  const resultDiv = document.getElementById('result');
  const loader = document.getElementById('loader');

  let finalHTML = htmlCode;

  if (!htmlCode.trim() && !fileInput) {
    alert('Pehle code likhein ya file upload karein!');
    return;
  }

  btn.disabled = true;
  resultDiv.style.display = 'none';
  loader.style.display = 'block';

  try {
    // Agar user ne file upload ki hai
    if (fileInput) {
      if (fileInput.name.endsWith('.html')) {
        finalHTML = await fileInput.text();
      } 
      else if (fileInput.name.endsWith('.zip')) {
        // ZIP file ko extract karna
        const zip = new JSZip();
        const contents = await zip.loadAsync(fileInput);
        
        // Index.html dhoondein (chahe root mein ho ya folder ke andar)
        let indexFile = contents.file('index.html');
        if (!indexFile) {
           // Agar root mein nahi hai, toh pehla .html file utha lein
           const htmlFiles = Object.keys(contents.files).filter(f => f.endsWith('.html'));
           if (htmlFiles.length > 0) indexFile = contents.file(htmlFiles[0]);
        }

        if (!indexFile) throw new Error("ZIP mein koi HTML file nahi mili.");
        
        finalHTML = await indexFile.async('text');
      }
    }

    if (!finalHTML || !finalHTML.trim()) {
      throw new Error("HTML code khali hai.");
    }

    // JSONBlob API par save karein (No Login Required)
    const response = await fetch('https://jsonblob.com/api/jsonBlob', {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({ 
        name: projectName, 
        html: finalHTML 
      })
    });

    if (!response.ok) throw new Error("Server par save nahi ho saka.");

    // Response header se ID nikaalein
    const location = response.headers.get('Location'); // e.g. https://jsonblob.com/api/jsonBlob/123456789
    const id = location.split('/').pop();
    
    // Live URL banayein (Current Domain + # + ID)
    const liveUrl = window.location.origin + window.location.pathname + '#' + id;

    // Result show karein
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = `
      <h3 style="margin-top:0;">🎉 Mubarak ho! Aapki website live ho gayi.</h3>
      <p style="color:#fff; font-size:0.9rem;">Yeh link hamesha ke liye kaam karega. Aap isay kisi ke sath bhi share kar sakte hain.</p>
      <a href="${liveUrl}" target="_blank">${liveUrl}</a>
      <button class="copy-btn" onclick="copyToClipboard('${liveUrl}')">Copy Link</button>
    `;

  } catch (error) {
    console.error(error);
    alert("Error: " + error.message);
  } finally {
    btn.disabled = false;
    loader.style.display = 'none';
  }
}

/* Copy Link Function */
function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    alert("Link Copy Ho Gaya! 📋");
  }).catch(() => {
    alert("Copy nahi ho saka, manually copy karein.");
  });
}
</script>
</body>
</html>
