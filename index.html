<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYRA PINME - Created by Muhammad Taqi</title>
<!-- Puter.js لائبریری شامل کریں -->
<script src="https://js.puter.com/v2/"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root { --bg: #07070c; --surface: #12121a; --stroke: #2a2a35; --text: #f2f3f8; --brand: #7c5cff; --success: #2ee6a8; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  .header { text-align: center; margin-bottom: 30px; }
  .header h1 { background: linear-gradient(90deg, #7c5cff, #21d4fd); -webkit-background-clip: text; color: transparent; margin: 0 0 10px; font-size: 2.5rem; }
  .card { background: var(--surface); border: 1px solid var(--stroke); border-radius: 16px; padding: 30px; width: 100%; max-width: 600px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
  .input-group { margin-bottom: 20px; }
  label { display: block; font-size: 0.9rem; margin-bottom: 8px; color: #9aa0b5; }
  input[type="text"], textarea { width: 100%; padding: 12px; background: #0a0a0f; border: 1px solid var(--stroke); border-radius: 8px; color: #fff; font-family: inherit; box-sizing: border-box; transition: 0.3s; }
  input:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(124,92,255,0.2); }
  textarea { height: 200px; font-family: 'JetBrains Mono', monospace; resize: vertical; }
  .btn { background: linear-gradient(90deg, #7c5cff, #21d4fd); color: #fff; border: none; padding: 16px; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.3s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(124,92,255,0.4); }
  .btn:disabled { background: #333; cursor: not-allowed; transform: none; box-shadow: none; }
  #result { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; background: rgba(46, 230, 168, 0.1); border: 1px solid var(--success); color: var(--success); text-align: center; word-wrap: break-word; }
  #result a { color: #8ce8ff; font-weight: bold; text-decoration: underline; }
</style>
</head>
<body>

<div class="header">
  <h1>LYRA PINME</h1>
  <p style="color: #9aa0b5;">Created by Muhammad Taqi</p>
</div>

<div class="card">
  <div class="input-group">
    <label>Project Name (Unique Subdomain)</label>
    <input type="text" id="projectName" placeholder="my-first-website">
  </div>
  
  <div class="input-group">
    <label>Option 1: Paste HTML Code</label>
    <textarea id="htmlCode" placeholder="<h1>Hello World</h1>"></textarea>
  </div>
  
  <div class="input-group">
    <label>Option 2: Upload .html or .zip file</label>
    <input type="file" id="fileUpload" accept=".html, .zip" style="color: #9aa0b5;">
  </div>

  <button class="btn" id="publishBtn" onclick="publishProject()">Publish Permanently 🚀</button>
  
  <div id="result"></div>
</div>

<script>
async function publishProject() {
  const projectName = document.getElementById('projectName').value.trim();
  const htmlCode = document.getElementById('htmlCode').value;
  const fileInput = document.getElementById('fileUpload').files[0];
  
  const btn = document.getElementById('publishBtn');
  const resultDiv = document.getElementById('result');

  if (!projectName) {
    alert('Project ka naam likhna zaroori hai!');
    return;
  }

  btn.disabled = true;
  btn.innerText = "Publishing... (Wait)";
  resultDiv.style.display = 'none';

  try {
    // 1. Puter.js کا استعمال کرتے ہوئے فائل سسٹم بنائیں
    const dirName = `lyra_${projectName}_${Date.now()}`;
    await puter.fs.mkdir(dirName);

    // 2. HTML کوڈ یا فائل کو محفوظ کریں
    if (fileInput) {
      if (fileInput.name.endsWith('.zip')) {
        // ZIP فائل کو اپ لوڈ کریں (Puter.js خود بخود ایکسٹریکٹ نہیں کرتا، اس لیے ہم JSZip استعمال کر سکتے ہیں، لیکن آسانی کے لیے صرف HTML کو سپورٹ کر رہے ہیں)
        alert('ZIP فائلیں فی الحال سپورٹڈ نہیں ہیں۔ براہ کرم HTML کوڈ پیسٹ کریں۔');
        return;
      } else {
        const text = await fileInput.text();
        await puter.fs.write(`${dirName}/index.html`, text);
      }
    } else if (htmlCode.trim()) {
      await puter.fs.write(`${dirName}/index.html`, htmlCode);
    } else {
      throw new Error('Na code mila, na file!');
    }

    // 3. Puter.js کے ذریعے ویب سائٹ ڈیپلائے کریں
    const site = await puter.hosting.create(projectName, dirName);
    const liveUrl = `https://${site.subdomain}.puter.site`;

    resultDiv.style.display = 'block';
    resultDiv.innerHTML = `<strong>Mubarak ho!</strong> Aapki website hamesha ke liye live ho gayi hai:<br><br>
    <a href="${liveUrl}" target="_blank">${liveUrl}</a>`;

  } catch (error) {
    console.error(error);
    alert("Error: " + error.message);
  } finally {
    btn.disabled = false;
    btn.innerText = "Publish Permanently 🚀";
  }
}
</script>
</body>
</html>
