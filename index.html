<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYRA PINME - Created by Muhammad Taqi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root { --bg: #07070c; --surface: #12121a; --stroke: #2a2a35; --text: #f2f3f8; --brand: #7c5cff; --success: #2ee6a8; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  .header { text-align: center; margin-bottom: 30px; }
  .header h1 { background: linear-gradient(90deg, #7c5cff, #21d4fd); -webkit-background-clip: text; color: transparent; margin: 0 0 10px; font-size: 2.5rem; }
  .card { background: var(--surface); border: 1px solid var(--stroke); border-radius: 16px; padding: 30px; width: 100%; max-width: 600px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: none; }
  .card.active { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .input-group { margin-bottom: 20px; }
  label { display: block; font-size: 0.9rem; margin-bottom: 8px; color: #9aa0b5; }
  input[type="text"], textarea { width: 100%; padding: 12px; background: #0a0a0f; border: 1px solid var(--stroke); border-radius: 8px; color: #fff; font-family: inherit; box-sizing: border-box; transition: 0.3s; }
  input:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(124,92,255,0.2); }
  textarea { height: 200px; font-family: 'JetBrains Mono', monospace; resize: vertical; }
  .btn { background: linear-gradient(90deg, #7c5cff, #21d4fd); color: #fff; border: none; padding: 16px; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.3s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(124,92,255,0.4); }
  .btn:disabled { background: #333; cursor: not-allowed; transform: none; box-shadow: none; }
  .landing-btn { max-width: 300px; font-size: 1.2rem; padding: 20px; margin: 0 auto; display: block; }
  #result { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; background: rgba(46, 230, 168, 0.1); border: 1px solid var(--success); color: var(--success); text-align: center; }
  #result a { color: #8ce8ff; font-weight: bold; word-break: break-all; }
</style>
</head>
<body>

<div class="header">
  <h1>LYRA PINME</h1>
  <p style="color: #9aa0b5;">Created by Muhammad Taqi</p>
</div>

<!-- Landing Screen -->
<div id="landing" class="card active" style="text-align: center;">
  <h2 style="margin-top:0;">Welcome to LYRA PINME</h2>
  <p style="color: #9aa0b5; margin-bottom: 30px;">Publish your HTML or ZIP files permanently to IPFS. No tokens, no logins. Just publish.</p>
  <button class="btn landing-btn" onclick="showForm()">Create Your Web 🚀</button>
</div>

<!-- Form Screen -->
<div id="formScreen" class="card">
  <div class="input-group">
    <label>Project Name (Unique)</label>
    <input type="text" id="projectName" placeholder="my-first-website">
  </div>
  
  <div class="input-group">
    <label>Option 1: Paste HTML Code</label>
    <textarea id="htmlCode" placeholder="<h1>Hello World</h1>"></textarea>
  </div>
  
  <div class="input-group">
    <label>Option 2: Upload .html or .zip file</label>
    <input type="file" id="fileUpload" accept=".html, .zip" style="color: #9aa0b5;">
  </div>

  <button class="btn" id="publishBtn" onclick="publishProject()">Publish Permanently 🚀</button>
  
  <div id="result"></div>
</div>

<script>
function showForm() {
  document.getElementById('landing').classList.remove('active');
  document.getElementById('formScreen').classList.add('active');
}

async function publishProject() {
  const projectName = document.getElementById('projectName').value.trim();
  const htmlCode = document.getElementById('htmlCode').value;
  const fileInput = document.getElementById('fileUpload').files[0];
  
  const btn = document.getElementById('publishBtn');
  const resultDiv = document.getElementById('result');

  if (!projectName) {
    alert('Project ka naam likhna zaroori hai!');
    return;
  }

  btn.disabled = true;
  btn.innerText = "Publishing to IPFS... (Wait)";
  resultDiv.style.display = 'none';

  try {
    const formData = new FormData();
    formData.append('projectName', projectName);
    formData.append('htmlCode', htmlCode);
    if (fileInput) {
      formData.append('file', fileInput);
    }

    const response = await fetch('/api/publish', {
      method: 'POST',
      body: formData
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Deployment failed");

    resultDiv.style.display = 'block';
    resultDiv.innerHTML = `<strong>Mubarak ho!</strong> Aapki website permanently live ho gayi hai:<br><br>
    <a href="${data.link}" target="_blank">${data.link}</a>`;

  } catch (error) {
    console.error(error);
    alert("Error: " + error.message);
  } finally {
    btn.disabled = false;
    btn.innerText = "Publish Permanently 🚀";
  }
}
</script>
</body>
</html>
